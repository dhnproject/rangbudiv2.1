                function onPlayerInit(player)
				{
					(function(player){
						(function(player) {
							function findConnector(win) {
								var retries = 0;
								while (!win.ispringPresentationConnector && win.parent && win.parent != win) {
									++retries;
									if (retries > 7) return null;
									win = win.parent;
								}
								return win.ispringPresentationConnector;
							}
							function getConnector() {
								var api = findConnector(window);
								if (!api && window.opener && (typeof(window.opener) != "undefined")) {
									api = findConnector(window.opener);
								}
								return api;
							}
							try {
								var connector = getConnector();
								if (connector) connector.register(player);
							} catch (e) {}
						})(player);
					})(player);

					var preloader = document.getElementById("preloader");
					if (preloader && preloader.parentNode) {
                        preloader.parentNode.removeChild(preloader);
                    }

                    // Initialize Mobile Controller App
                    if (window.initMobileApp) {
                        window.initMobileApp(player);
                    }
				}
			}

			if (startup)
				startup(start);
			else
				start();
		})());

        // Register Service Worker for PWA Offline Caching
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then((reg) => {
                    console.log('RANGBUDI Service Worker Registered Successfully:', reg.scope);
                }).catch((err) => {
                    console.log('Service Worker Registration Failed:', err);
                });
            });
